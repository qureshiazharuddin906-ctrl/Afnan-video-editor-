<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact — Afnan | Video Editor</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#080808;
  color:#f5f5f5;
  font-family:Arial,Helvetica,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1100px,90%);
  margin:auto;
}

/* NAV */

nav{
  height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #1d1d1d;
}

.logo{
  font-size:19px;
  font-weight:800;
  letter-spacing:4px;
}

.logo span{
  display:block;
  font-size:7px;
  letter-spacing:3px;
  color:#888;
  margin-top:-2px;
}

.navlinks{
  display:flex;
  gap:28px;
  font-size:13px;
  color:#999;
}

.navlinks a:nth-child(3){
  color:#fff;
}

/* MAIN */

main{
  padding:110px 0;
  min-height:calc(100vh - 78px);
}

.label{
  color:#777;
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:20px;
}

h1{
  font-size:clamp(55px,9vw,105px);
  line-height:.9;
  letter-spacing:-5px;
  max-width:850px;
}

.accent{
  color:#b8ff5c;
}

.intro{
  color:#888;
  max-width:520px;
  font-size:15px;
  line-height:1.7;
  margin:30px 0 50px;
}

/* CONTACT BOX */

.contact-box{
  border:1px solid #292929;
  border-radius:20px;
  overflow:hidden;
  display:grid;
  grid-template-columns:1fr 1fr;
}

.contact-info{
  padding:40px;
  background:#0d0d0d;
}

  font-size:25px;
  margin-bottom:12px
