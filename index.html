<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#080808;
    color:#f5f5f5;
    font-family:Arial,Helvetica,sans-serif;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:min(1100px,90%);
    margin:auto;
}

nav{
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #1d1d1d;
}

.logo{
    font-size:19px;
    font-weight:800;
    letter-spacing:4px;
}

.logo span{
    display:block;
    font-size:7px;
    letter-spacing:3px;
    color:#888;
    margin-top:-2px;
}

.navlinks{
    display:flex;
    gap:28px;
    font-size:13px;
    color:#999;
}

.navlinks a:last-child{
    color:#fff;
}

main{
    padding:100px 0;
}

.label{
    color:#777;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:20px;
}

h1{
    font-size:clamp(55px,9vw,105px);
    line-height:.9;
    letter-spacing:-5px;
    max-width:900px;
}

.accent{
    color:#b8ff5c;
}

.intro{
    color:#888;
    max-width:520px;
    font-size:15px;
    line-height:1.7;
    margin:30px 0 55px;
}

.contact-box{
    border:1px solid #292929;
    border-radius:20px;
    overflow:hidden;
    display:grid;
    grid-template-columns:1fr 1fr;
}

.contact-info{
    padding:40px;
    background:#0d0d0d;
}

.contact-info h2{
    font-size:27px;
    margin-bottom:12px;
}

.contact-info p{
    color:#777;
    font-size:13px;
    line-height:1.7;
}

.contact-links{
    margin-top:30px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.contact-link{
    border:1px solid #292929;
    padding:18px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:.2s;
}

.contact-link:hover{
    border-color:#777;
    transform:translateX(4px);
}

.contact-link small{
    display:block;
    color:#666;
    font-size:9px;
    letter-spacing:2px;
    margin-bottom:5px;
}

.contact-link strong{
    font-size:14px;
}

.project{
    padding:40px;
    background:radial-gradient(
        circle at 70% 30%,
        #222,
        transparent 35%
    ),#090909;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.project-number{
    color:#555;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:35px;
}

.project h2{
    font-size:45px;
    line-height:1;
    letter-spacing:-3px;
    margin-bottom:18px;
}

.project p{
    color:#777;
    font-size:13px;
    line-height:1.7;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    width:max-content;
    padding:14px 22px;
    border-radius:100px;
    background:#f5f5f5;
    color:#080808;
    font-size:13px;
}

footer{
    border-top:1px solid #171717;
    padding:30px 0;
    display:flex;
    justify-content:space-between;
    color:#666;
    font-size:11px;
}
