<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afnan — Video Editor</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#080808;
  color:#f5f5f5;
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.5;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1100px,90%);
  margin:auto;
}

/* NAVBAR */

nav{
  height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #1d1d1d;
}

.logo{
  font-size:19px;
  font-weight:800;
  letter-spacing:4px;
}

.logo span{
  display:block;
  font-size:7px;
  letter-spacing:3px;
  color:#888;
  margin-top:-2px;
}

.navlinks{
  display:flex;
  gap:28px;
  font-size:13px;
  color:#999;
}

.navlinks a:hover{
  color:white;
}

/* HERO */

.hero{
  min-height:calc(100vh - 78px);
  display:flex;
  align-items:center;
  padding:70px 0;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:60px;
  align-items:center;
}

.tag{
  color:#8d8d8d;
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:20px;
}

h1{
  font-size:clamp(52px,8vw,100px);
  line-height:.9;
  letter-spacing:-5px;
  margin-bottom:28px;
}

.accent{
  color:#b8ff5c;
}

.hero-text{
  max-width:500px;
  color:#999;
  font-size:16px;
  margin-bottom:32px;
}

.buttons{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

.btn{
  padding:14px 21px;
  border:1px solid #333;
  border-radius:100px;
  font-size:13px;
  transition:.2s;
}

.btn.primary{
  background:#f5f5f5;
  color:#080808;
  border-color:#f5f5f5;
}

.btn:hover{
  transform:translateY(-2px);
}

/* HERO VISUAL */

.hero-visual{
  height:480px;
  border:1px solid #292929;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  background:
  radial-gradient(circle at 70% 25%,#4d4d4d 0%,transparent 28%),
  linear-gradient(145deg,#252525,#0b0b0b 65%);
}

.hero-visual:before{
  content:"";
  position:absolute;
  inset:20px;
  border:1px solid #333;
  border-radius:14px;
}

.visual-text{
  position:absolute;
  bottom:28px;
  left:28px;
  font-size:12px;
  letter-spacing:2px;
  color:#aaa;
}

/* WORK PREVIEW */

section{
  padding:100px 0;
  border-top:1px solid #171717;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:35px;
}

.section-label{
  color:#777;
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:10px;
}

h2{
  font-size:42px;
  letter-spacing:-2px;
}

.view-all{
  color:#aaa;
  font-size:13px;
}

.work-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.work-card{
  min-height:300px;
  border:1px solid #272727;
  border-radius:16px;
  overflow:hidden;
  background:#101010;
  position:relative;
}

.work-image{
  height:230px;
  background:
  linear-gradient(135deg,#303030,#111);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.play{
  width:48px;
  height:48px;
  border:1px solid #777;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}

.work-info{
  padding:17px;
}

.work-info h3{
  font-size:17px;
  margin-bottom:4px;
}

.work-info p{
  font-size:12px;
  color:#777;
}

/* SERVICES */

.services{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  border:1px solid #272727;
}

.service{
  padding:28px 22px;
  min-height:170px;
  background:#0c0c0c;
}

.service-number{
  color:#666;
  font-size:11px;
  margin-bottom:35px;
}

.service h3{
  font-size:16px;
  margin-bottom:8px;
}

.service p{
  color:#777;
  font-size:12px;
}

/* CTA */

.cta{
  padding:90px 40px;
  border:1px solid #292929;
  border-radius:20px;
  text-align:center;
  background:
  radial-gradient(circle at center,#191919,#090909 60%);
}

.cta h2{
  font-size:clamp(38px,6vw,70px);
  max-width:700px;
  margin:0 auto 25px;
}

.cta p{
  color:#777;
  margin-bottom:30px;
}

/* FOOTER */

footer{
  padding:30px 0;
  border-top:1px solid #171717;
  display:flex;
  justify-content:space-between;
  color:#666;
  font-size:11px;
}

/* MOBILE */

@media(max-width:750px){

  nav{
    height:65px;
  }

  .navlinks{
    gap:14px;
    font-size:11px;
  }

  .hero{
    padding:55px 0;
  }

  .hero-grid{
    grid-template-columns:1fr;
    gap:45px;
  }

  h1{
    font-size:62px;
    letter-spacing:-4px;
  }

  .hero-text{
    font-size:14px;
  }

  .hero-visual{
    height:330px;
  }

  section{
    padding:70px 0;
  }

  h2{
    font-size:34px;
  }

  .section-head{
    align-items:start;
    gap:20px;
  }

  .work-grid{
    grid-template-columns:1fr;
  }

  .services{
    grid-template-columns:1fr 1fr;
  }

  .service{
    min-height:150px;
  }

  .cta{
    padding:65px 20px;
  }

  footer{
    flex-direction:column;
    gap:10px;
  }
}
</style>
</head>

<body>

<div class="container">

<nav>
  <a href="index.html" class="logo">
    AFNAN
    <span>VIDEO EDITOR</span>
  </a>

  <div class="navlinks">
    <a href="index.html">Home</a>
    <a href="work.html">Work</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>
